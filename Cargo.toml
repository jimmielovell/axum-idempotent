[package]
name = "axum-idempotent"
description = "A middleware for handling idempotent requests in axum applications."
version = "0.3.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Jimmie Lovell <jimmieomlovell@gmail.com>"]
license = "MIT"
homepage = "https://github.com/jimmielovell/axum-idempotent"
keywords = ["idempotency", "sessions", "axum"]
categories = ["network-programming", "web-programming"]
repository = "https://github.com/jimmielovell/axum-idempotent"
documentation = "https://docs.rs/axum-idempotent"
readme = "README.md"
exclude = [".idea", ".DS_Store"]

[features]
layered-store = ["ruts/layered-store"]

[dependencies]
axum = { version = "0.8.9" }
blake3 = "1.8.7"
http-body-util = "0.1.5"
tower-service = "0.3.3"
tower-layer = "0.3.3"
tracing = "0.1.44"
ruts = "0.11.1"
serde_bytes = "0.11.19"

[dev-dependencies]
ruts = { version = "0.11.1", features = ["moka-store"] }
tower-cookies = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
futures-util = "0.3.34"

[[test]]
name = "axum"